name: Generate textbook figure assets

on:
  workflow_dispatch:
  push:
    branches:
      - figure-layout-prototype
    paths:
      - 'figures/generate_figures.py'
      - 'figures/generate_new_figures.py'
      - 'figures/generate_ch07_09.py'
      - 'figures/generate_ch10_12.py'
      - 'figures/generate_ch13_15.py'
      - 'figures/generate_ch16_17.py'
      - 'figures/grayscale_eps.py'
      - '.github/workflows/generate-figures.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ghostscript

      - name: Install Python dependencies
        run: python -m pip install --upgrade numpy matplotlib

      - name: Generate EPS, SVG, and PDF figures
        run: |
          python figures/generate_figures.py
          python figures/generate_new_figures.py
          python figures/generate_ch07_09.py
          python figures/generate_ch10_12.py
          python figures/generate_ch13_15.py
          python figures/generate_ch16_17.py

      - name: Normalize EPS color operators to grayscale without rewriting geometry
        run: python figures/grayscale_eps.py figures/eps || true

      - name: Normalize PDF assets to DeviceGray
        run: |
          set -euo pipefail
          mkdir -p figures/pdf-gray
          for f in figures/pdf/*.pdf; do
            stem=$(basename "$f")
            gs -q -dSAFER -dBATCH -dNOPAUSE \
              -sDEVICE=pdfwrite \
              -dCompatibilityLevel=1.7 \
              -sColorConversionStrategy=Gray \
              -dProcessColorModel=/DeviceGray \
              -dOverrideICC \
              -sOutputFile="figures/pdf-gray/$stem" \
              "$f"
          done
          mv figures/pdf-gray/*.pdf figures/pdf/
          rmdir figures/pdf-gray

      - name: Validate asset counts
        run: |
          set -euo pipefail
          test "$(find figures/eps -maxdepth 1 -name 'fig*.eps' | wc -l)" -eq 52
          test "$(find figures/svg -maxdepth 1 -name 'fig*.svg' | wc -l)" -eq 52
          test "$(find figures/pdf -maxdepth 1 -name 'fig*.pdf' | wc -l)" -eq 52

      - name: Validate EPS grayscale ink coverage
        run: |
          set -euo pipefail
          for f in figures/eps/*.eps; do
            gs -q -dSAFER -dBATCH -dNOPAUSE -dEPSCrop -sDEVICE=nullpage "$f"
            coverage=$(gs -q -dSAFER -dBATCH -dNOPAUSE -dEPSCrop -sDEVICE=inkcov -o - "$f" | tail -n 1)
            echo "$(basename "$f"): $coverage"
            echo "$coverage" | awk '{ if (($1+0) > 0.00001 || ($2+0) > 0.00001 || ($3+0) > 0.00001) exit 1 }'
          done

      - name: Validate PDF grayscale ink coverage
        run: |
          set -euo pipefail
          for f in figures/pdf/*.pdf; do
            while read -r c m y k rest; do
              awk -v c="$c" -v m="$m" -v y="$y" 'BEGIN { if ((c+0) > 0.00001 || (m+0) > 0.00001 || (y+0) > 0.00001) exit 1 }'
            done < <(gs -q -dSAFER -dBATCH -dNOPAUSE -sDEVICE=inkcov -o - "$f" | grep 'CMYK OK')
          done

      - name: Validate SVG grayscale colors and editable text
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = sorted(Path("figures/svg").glob("fig*.svg"))
          assert len(files) == 52, len(files)
          bad = []
          missing_text = []
          for path in files:
              s = path.read_text(encoding="utf-8")
              if "<text" not in s:
                  missing_text.append(path.name)
              for token in re.findall(r"#[0-9A-Fa-f]{6}", s):
                  r = int(token[1:3], 16)
                  g = int(token[3:5], 16)
                  b = int(token[5:7], 16)
                  if not (r == g == b):
                      bad.append((path.name, token))
          if missing_text:
              raise SystemExit(f"SVG files without editable text elements: {missing_text}")
          if bad:
              raise SystemExit(f"Chromatic SVG colors found: {bad[:20]}")
          print("All 52 SVG files contain text elements and grayscale-only hex colors.")
          PY

      - name: Commit generated EPS, SVG, and PDF assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/eps/*.eps figures/svg/*.svg figures/pdf/*.pdf
          if git diff --cached --quiet; then
            echo "No figure asset changes to commit."
          else
            git commit -m "Generate grayscale EPS, editable SVG, and PDF figure assets [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
