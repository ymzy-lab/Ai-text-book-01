name: Generate textbook figure assets (PDF-first)

on:
  workflow_dispatch:
  push:
    branches:
      - figure-layout-prototype
    paths:
      - 'figures/generate_figures.py'
      - 'figures/generate_new_figures.py'
      - 'figures/generate_ch07_09.py'
      - 'figures/generate_ch10_12.py'
      - 'figures/generate_ch13_15.py'
      - 'figures/generate_ch16_17.py'
      - 'figures/grayscale_eps.py'
      - 'figures/PRINT_SPEC.md'
      - '.github/workflows/generate-figures.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ghostscript poppler-utils

      - name: Install Python dependencies
        run: python -m pip install --upgrade numpy matplotlib

      - name: Generate native PDF, editable SVG, and optional EPS
        run: |
          python figures/generate_figures.py
          python figures/generate_new_figures.py
          python figures/generate_ch07_09.py
          python figures/generate_ch10_12.py
          python figures/generate_ch13_15.py
          python figures/generate_ch16_17.py

      - name: Normalize optional EPS side output without rewriting geometry
        run: python figures/grayscale_eps.py figures/eps

      - name: Confirm PDF-first production policy
        run: |
          echo "figures/pdf/*.pdf are the LaTeX production assets."
          echo "They are generated directly by Matplotlib with pdf.fonttype=42."
          echo "They are not rewritten from EPS or through Ghostscript."

      - name: Validate asset counts
        run: |
          set -euo pipefail
          test "$(find figures/eps -maxdepth 1 -name 'fig*.eps' | wc -l)" -eq 52
          test "$(find figures/svg -maxdepth 1 -name 'fig*.svg' | wc -l)" -eq 52
          test "$(find figures/pdf -maxdepth 1 -name 'fig*.pdf' | wc -l)" -eq 52

      - name: Validate native PDF grayscale ink coverage and text
        run: |
          set -euo pipefail
          for f in figures/pdf/*.pdf; do
            while read -r c m y k rest; do
              awk -v c="$c" -v m="$m" -v y="$y" 'BEGIN { if ((c+0) > 0.00001 || (m+0) > 0.00001 || (y+0) > 0.00001) exit 1 }'
            done < <(gs -q -dSAFER -dBATCH -dNOPAUSE -sDEVICE=inkcov -o - "$f" | grep 'CMYK OK')
          done
          echo "=== representative PDF fonts ==="
          pdffonts figures/pdf/fig00_knowledge_map.pdf
          echo "=== representative PDF text ==="
          pdftotext figures/pdf/fig00_knowledge_map.pdf - | grep -F "神話・観測"
          pdftotext figures/pdf/fig00_knowledge_map.pdf - | grep -F "AIと物理学の系譜"

      - name: Validate editable SVG grayscale colors and black-first text
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = sorted(Path("figures/svg").glob("fig*.svg"))
          assert len(files) == 52, len(files)
          bad_colors = []
          missing_text = []
          bad_text = []
          allowed_text = {"#000000", "#555555"}

          for path in files:
              s = path.read_text(encoding="utf-8")
              text_tags = re.findall(r"<text\b[^>]*>", s)
              if not text_tags:
                  missing_text.append(path.name)

              for token in re.findall(r"#[0-9A-Fa-f]{6}", s):
                  r = int(token[1:3], 16)
                  g = int(token[3:5], 16)
                  b = int(token[5:7], 16)
                  if not (r == g == b):
                      bad_colors.append((path.name, token))

              for tag in text_tags:
                  fills = re.findall(r"fill:\s*(#[0-9A-Fa-f]{6})", tag)
                  for fill in fills:
                      fill = fill.lower()
                      if fill not in allowed_text:
                          bad_text.append((path.name, fill, tag[:160]))

          if missing_text:
              raise SystemExit(f"SVG files without editable text elements: {missing_text}")
          if bad_colors:
              raise SystemExit(f"Chromatic SVG colors found: {bad_colors[:20]}")
          if bad_text:
              raise SystemExit(f"SVG text not black/dark-gray: {bad_text[:20]}")

          print("All 52 SVG files use grayscale-only graphics and black/dark-gray editable text.")
          PY

      - name: Validate optional EPS side output
        run: |
          set -euo pipefail
          for f in figures/eps/*.eps; do
            gs -q -dSAFER -dBATCH -dNOPAUSE -dEPSCrop -sDEVICE=nullpage "$f"
            coverage=$(gs -q -dSAFER -dBATCH -dNOPAUSE -dEPSCrop -sDEVICE=inkcov -o - "$f" | tail -n 1)
            echo "$(basename "$f"): $coverage"
            echo "$coverage" | awk '{ if (($1+0) > 0.00001 || ($2+0) > 0.00001 || ($3+0) > 0.00001) exit 1 }'
          done

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/pdf/*.pdf figures/svg/*.svg figures/eps/*.eps
          if git diff --cached --quiet; then
            echo "No figure asset changes to commit."
          else
            git commit -m "Generate native PDF, editable SVG, and optional EPS figure assets"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
