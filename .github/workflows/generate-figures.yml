name: Generate textbook EPS figures

on:
  workflow_dispatch:
  push:
    branches:
      - figure-layout-prototype
    paths:
      - 'figures/generate_figures.py'
      - 'figures/generate_new_figures.py'
      - 'figures/generate_ch07_09.py'
      - 'figures/generate_ch10_12.py'
      - 'figures/generate_ch13_15.py'
      - 'figures/generate_ch16_17.py'
      - 'figures/grayscale_eps.py'
      - '.github/workflows/generate-figures.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ghostscript

      - name: Install Python dependencies
        run: python -m pip install --upgrade numpy matplotlib

      - name: Generate native Matplotlib EPS figures
        run: |
          python figures/generate_figures.py
          python figures/generate_new_figures.py
          python figures/generate_ch07_09.py
          python figures/generate_ch10_12.py
          python figures/generate_ch13_15.py
          python figures/generate_ch16_17.py

      - name: Convert EPS color operators to grayscale without rewriting geometry
        run: python figures/grayscale_eps.py figures/eps

      - name: Validate EPS files and grayscale ink coverage
        run: |
          set -euo pipefail
          count=0
          for f in figures/eps/*.eps; do
            gs -q -dSAFER -dBATCH -dNOPAUSE -dEPSCrop -sDEVICE=nullpage "$f"
            coverage=$(gs -q -dSAFER -dBATCH -dNOPAUSE -dEPSCrop -sDEVICE=inkcov -o - "$f" | tail -n 1)
            echo "$(basename "$f"): $coverage"
            echo "$coverage" | awk '{ if (($1+0) > 0.00001 || ($2+0) > 0.00001 || ($3+0) > 0.00001) exit 1 }'
            count=$((count+1))
          done
          test "$count" -eq 52

      - name: Commit generated grayscale EPS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/eps/*.eps
          if git diff --cached --quiet; then
            echo "No EPS changes to commit."
          else
            git commit -m "Generate geometry-preserving grayscale EPS figures [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
