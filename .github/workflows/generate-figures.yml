name: Generate textbook EPS figures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'figures/generate_figures.py'
      - 'figures/generate_new_figures.py'
      - 'figures/generate_ch07_09.py'
      - 'figures/generate_ch10_12.py'
      - '.github/workflows/generate-figures.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ghostscript

      - name: Install Python dependencies
        run: python -m pip install --upgrade numpy matplotlib

      - name: Generate EPS figures
        run: |
          python figures/generate_figures.py
          python figures/generate_new_figures.py
          python figures/generate_ch07_09.py
          python figures/generate_ch10_12.py

      - name: Validate EPS files with Ghostscript
        run: |
          for f in figures/eps/*.eps; do
            gs -q -dSAFER -dBATCH -dNOPAUSE -dEPSCrop -sDEVICE=nullpage "$f"
          done

      - name: Commit generated EPS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/eps/*.eps
          if git diff --cached --quiet; then
            echo "No EPS changes to commit."
          else
            git commit -m "Generate textbook EPS figures [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
