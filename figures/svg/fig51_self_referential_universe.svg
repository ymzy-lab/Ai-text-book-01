   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'Noto Sans CJK JP', 'Noto Sans CJK JP Regular', 'DejaVu Sans', sans-serif; text-anchor: middle" x="94.733261" y="344.626156" transform="rotate(-0 94.733261 344.626156)">AI</text>
